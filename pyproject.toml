[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecac-login"
version = "0.1.10"
description = "Login automatizado no portal eCAC via Patchright com suporte a certificado digital"
requires-python = ">=3.10"
dependencies = [
    "patchright",
    "python-dotenv",
    "ResolvedorCaptcha @ git+https://github.com/tecnologia-save/ResolvedorCaptcha-Python.git@d029888bb4de4d33390ab1ee3b3c7c51caf01353",
    # cert_dialog.py importa pywinauto para escolher o certificado no diálogo
    # nativo do Windows. O import é tardio, então `import ecac_login` passa e a
    # falta só aparece no meio do login — navegador aberto, captcha já
    # resolvido. O ponto mais caro possível para descobrir que falta um pacote.
    #
    # Atenção: instalar não basta em toda máquina. Veja "Requisitos de Windows"
    # no README — o pywin32 precisa de caminhos longos ligados para sequer
    # extrair, e o win32ui precisa do runtime MFC, que nenhum pip instala.
    "pywinauto",
]

[dependency-groups]
# Ferramentas de desenvolvimento — NAO sao dependencias de runtime da lib.
# Instalacao: pip install --group dev   (requer pip >= 25.1)
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ecac_login*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]