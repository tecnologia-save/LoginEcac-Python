[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecac-login"
version = "0.1.0"
description = "Login automatizado no portal eCAC via Patchright com suporte a certificado digital"
requires-python = ">=3.10"
dependencies = [
    "patchright",
    "python-dotenv",
    "ResolvedorCaptcha @ git+https://github.com/tecnologia-save/ResolvedorCaptcha-Python.git@9188f180c7c44ca5e3c42bad6cfdd2ceddb3a0c1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ecac_login*"]