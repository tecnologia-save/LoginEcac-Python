[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecac-login"
version = "0.1.1"
description = "Login automatizado no portal eCAC via Patchright com suporte a certificado digital"
requires-python = ">=3.10"
dependencies = [
    "patchright",
    "python-dotenv",
    "ResolvedorCaptcha @ git+https://github.com/tecnologia-save/ResolvedorCaptcha-Python.git@2498006701c4e73d99736080fb6a2e103acbf241",
]

[dependency-groups]
# Ferramentas de desenvolvimento — NAO sao dependencias de runtime da lib.
# Instalacao: pip install --group dev   (requer pip >= 25.1)
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ecac_login*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]